name: Build xFelix Sign

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          pwd
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort
          echo "Xcode projects:"
          find . -name "*.xcodeproj" -print

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project xfelixSign.xcodeproj \
            -scheme "xFelix Sign" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package app
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/xFelix Sign.app" Payload/
          zip -r xFelix-Sign-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xFelix-Sign-unsigned
          path: xFelix-Sign-unsigned.ipa