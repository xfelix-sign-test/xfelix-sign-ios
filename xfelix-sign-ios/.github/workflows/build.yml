name: Build xFelix Sign

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Diagnose repository
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== ROOT CONTENTS ==="
          ls -la

          echo "=== PROJECT SEARCH ==="
          find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -print

          echo "=== WORKSPACE ==="
          echo "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE" -name "xfelixSign.xcodeproj" -print -quit)

          echo "Found project:"
          echo "$PROJECT"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: xfelixSign.xcodeproj was not found"
            exit 1
          fi

          xcodebuild \
            -project "$PROJECT" \
            -scheme "xFelix Sign" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package app
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/xFelix Sign.app" Payload/
          zip -r xFelix-Sign-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xFelix-Sign-unsigned
          path: xFelix-Sign-unsigned.ipa