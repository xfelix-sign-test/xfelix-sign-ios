name: Build xFelix Sign

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose paths
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Xcode project:"
          ls -la xfelixSign.xcodeproj
          echo "Project file:"
          test -f xfelixSign.xcodeproj/project.pbxproj

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/xfelixSign.xcodeproj" \
            -scheme "xFelix Sign" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package app
        run: |
          mkdir -p Payload
          cp -R "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/xFelix Sign.app" Payload/
          zip -r xFelix-Sign-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xFelix-Sign-unsigned
          path: xFelix-Sign-unsigned.ipa