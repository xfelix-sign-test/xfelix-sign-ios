name: Build xFelix Sign

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show repository structure
        run: |
          pwd
          find . -maxdepth 4 -type f | sort

      - name: Build
        working-directory: xfelix-sign-ios
        run: |
          xcodebuild \
            -project xfelixSign.xcodeproj \
            -scheme "xFelix Sign" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package app
        working-directory: xfelix-sign-ios
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/xFelix Sign.app" Payload/
          zip -r "xFelix-Sign-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xFelix-Sign-IPA
          path: xfelix-sign-ios/xFelix-Sign-unsigned.ipa