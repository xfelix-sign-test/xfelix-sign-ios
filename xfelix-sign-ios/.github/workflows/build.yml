name: Build xFelix Sign

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose checkout
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "PWD:"
          pwd
          echo "ROOT:"
          ls -la
          echo "ALL XCODE PROJECTS:"
          find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -print
          echo "ALL PROJECT FILES:"
          find "$GITHUB_WORKSPACE" -name "project.pbxproj" -print

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE" -name "xfelixSign.xcodeproj" -type d | head -n 1)
          echo "Using project: $PROJECT"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: xfelixSign.xcodeproj not found"
            exit 1
          fi

          xcodebuild \
            -project "$PROJECT" \
            -scheme "xFelix Sign" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/xFelix Sign.app" "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          zip -r xFelix-Sign-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xFelix-Sign-unsigned
          path: xFelix-Sign-unsigned.ipa